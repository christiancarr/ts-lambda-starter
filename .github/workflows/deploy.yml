name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC token minting
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials (OIDC, no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::021934453023:role/github-deploy
          aws-region: us-east-2

      - run: npm ci

      - name: Type check
        run: npm run build

      - name: Deploy
        run: npx cdk deploy --require-approval never
